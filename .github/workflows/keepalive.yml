# Render free-tier keep-alive.
#
# The API on Render's free plan spins down after ~15 minutes of inactivity and
# takes 30-60s to cold-start, which makes the app's first page load look broken.
# This workflow pings the health endpoint every 10 minutes to keep the instance
# warm. Delete this file once the API moves to a paid Render plan (which does
# not spin down).
name: keepalive

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by a few minutes; that
    # is fine — we just need to beat Render's ~15 minute idle window most of
    # the time.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health endpoint
        # Short timeout and `|| true` so a sleeping/slow API never fails the
        # run — the request itself is what wakes the instance up.
        run: |
          curl --silent --show-error --max-time 30 \
            https://sa-church-finder-api.onrender.com/api/v1/health || true
